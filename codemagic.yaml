# Codemagic CI/CD — https://codemagic.io
#
# - ios-unsigned: يعمل تلقائياً مع كل push على main: تحليل واختبارات، ثم ملف
#   IPA غير موقّع (يُثبَّت بعد إعادة توقيعه عبر Sideloadly أو AltStore).
# - android-apk: يدوي، ويُخرج APK للتجربة.
# - ios-testflight: يدوي، ويحتاج حساب Apple Developer وربط مفتاح
#   App Store Connect في Codemagic (Teams → Integrations) باسم "Nisbati ASC".

definitions:
  environment: &env
    flutter: 3.44.6
  scripts:
    - &get_packages
      name: Get packages
      script: flutter pub get
    - &codegen
      name: Generate code (drift)
      script: dart run build_runner build --delete-conflicting-outputs
    - &analyze
      name: Analyze
      script: flutter analyze --no-fatal-infos
    - &test
      name: Unit & widget tests
      script: flutter test test/

workflows:
  android-apk:
    name: Android APK
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      <<: *env
      java: 17
    scripts:
      - *get_packages
      - *codegen
      - *analyze
      - *test
      - name: Build APK
        script: flutter build apk --release --build-number=$PROJECT_BUILD_NUMBER
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

  ios-unsigned:
    name: iOS build check (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      <<: *env
      xcode: latest
      cocoapods: default
    triggering:
      events: [push]
      branch_patterns:
        - pattern: main
    scripts:
      - *get_packages
      - *codegen
      - *analyze
      - *test
      - name: Build iOS (no codesign)
        script: flutter build ios --release --no-codesign --build-number=$PROJECT_BUILD_NUMBER
      # IPA غير موقّع: يُثبَّت عبر أدوات تعيد توقيعه بحساب Apple (مثل Sideloadly أو AltStore).
      - name: Package unsigned IPA
        script: |
          cd build/ios/iphoneos
          rm -rf Payload && mkdir Payload
          cp -R Runner.app Payload/
          zip -qry "nisbati-$PROJECT_BUILD_NUMBER-unsigned.ipa" Payload
    artifacts:
      - build/ios/iphoneos/*.ipa

  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Nisbati ASC
    environment:
      <<: *env
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ly.nisbati.nisbati
    scripts:
      - *get_packages
      - *codegen
      - *test
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
